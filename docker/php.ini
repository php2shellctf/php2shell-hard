; Deliberately vulnerable local CTF profile. Do not use in production.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Hard profile: the OOM preparation must be recalibrated for a larger limit.
memory_limit = 16M
post_max_size = 64M
upload_max_filesize = 64M
max_input_vars = 1000

session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
; A static custom field is a normal per-application INI override.
session.upload_progress.name = CTF_SESSION_UPLOAD_PROGRESS
session.upload_progress.cleanup = On
